<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ダダサバ風サバイバルゲーム - 超サクサク版</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #1a252f; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
        canvas { display: block; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        #exp-bar-container { position: absolute; top: 0; left: 0; width: 100%; height: 15px; background: #333; border-bottom: 2px solid #222; }
        #exp-bar { width: 0%; height: 100%; background: #2ecc71; transition: width 0.2s; }
        
        #status { position: absolute; top: 25px; left: 10px; color: white; font-family: sans-serif; font-weight: bold; font-size: 16px; text-shadow: 1px 1px 2px black; }
        #timer { position: absolute; top: 25px; right: 10px; color: white; font-family: sans-serif; font-weight: bold; font-size: 24px; text-shadow: 1px 1px 2px black; }
        
        #joystick-base { position: absolute; width: 120px; height: 120px; background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%; display: none; transform: translate(-50%, -50%); pointer-events: auto; z-index: 10; }
        #joystick-stick { position: absolute; width: 50px; height: 50px; background: rgba(255, 255, 255, 0.6); border-radius: 50%; top: 50%; left: 50%; margin-top: -25px; margin-left: -25px; pointer-events: none; }
        
        #level-up-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); display: none; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto; z-index: 20; }
        #level-up-modal h2 { color: #f1c40f; font-family: sans-serif; font-size: 32px; margin-bottom: 10px; text-shadow: 2px 2px 4px black; }
        
        #skill-choices { display: flex; flex-direction: column; align-items: center; width: 100%; max-height: 75vh; overflow-y: auto; padding-bottom: 20px; }
        .skill-card { background: linear-gradient(135deg, #34495e, #2c3e50); border: 2px solid #f1c40f; border-radius: 10px; width: 80%; max-width: 400px; padding: 15px; margin: 6px 0; color: white; font-family: sans-serif; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.5); flex-shrink: 0; }
        .skill-card:active { transform: scale(0.98); }
        .skill-name { font-size: 18px; font-weight: bold; color: #f1c40f; }
        .skill-desc { font-size: 13px; margin-top: 5px; color: #bdc3c7; }
        
        #game-over { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #e74c3c; font-family: sans-serif; font-size: 40px; font-weight: bold; text-shadow: 2px 2px 4px black; display: none; text-align: center; pointer-events: auto; z-index: 30; background: rgba(0,0,0,0.7); padding: 20px; border-radius: 10px; }
        #boss-warning { position: absolute; top: 30%; left: 0; width: 100%; text-align: center; color: #e74c3c; font-size: 36px; font-weight: bold; text-shadow: 0 0 15px red, 2px 2px 5px black; display: none; z-index: 25; font-family: sans-serif; }
    </style>
</head>
<body>

    <div id="exp-bar-container"><div id="exp-bar"></div></div>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div id="status">LV: <span id="level-display">1</span></div>
        <div id="timer">00:00</div>
        <div id="joystick-base"><div id="joystick-stick"></div></div>
        
        <div id="level-up-modal">
            <h2>LEVEL UP!</h2>
            <div id="skill-choices"></div>
        </div>

        <div id="boss-warning">⚠️ 巨大ボス襲来 ⚠️</div>
        <div id="game-over">GAME OVER<br><span style="font-size: 20px; color: white;">画面タップで再挑戦</span></div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        const WORLD_WIDTH = 4000; const WORLD_HEIGHT = 4000;
        let camera = { x: 0, y: 0 };

        function resize() { width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height; }
        window.addEventListener('resize', resize); resize();

        function isVisible(x, y, radius) {
            return x + radius > camera.x && x - radius < camera.x + width && y + radius > camera.y && y - radius < camera.y + height;
        }

        const joystickBase = document.getElementById('joystick-base');
        const joystickStick = document.getElementById('joystick-stick');
        let isTouching = false; let joyOrigin = { x: 0, y: 0 }; let joyVector = { x: 0, y: 0 }; 

        document.addEventListener('touchstart', handleStart, {passive: false}); document.addEventListener('touchmove', handleMove, {passive: false});
        document.addEventListener('touchend', handleEnd); document.addEventListener('mousedown', handleStart);
        document.addEventListener('mousemove', handleMove); document.addEventListener('mouseup', handleEnd);

        function handleStart(e) {
            if(isPaused || isGameOver || e.target.closest('#level-up-modal') || e.target.closest('#game-over')) return;
            e.preventDefault(); isTouching = true;
            const cx = e.touches ? e.touches[0].clientX : e.clientX; const cy = e.touches ? e.touches[0].clientY : e.clientY;
            joyOrigin = { x: cx, y: cy }; joystickBase.style.display = 'block'; joystickBase.style.left = cx + 'px'; joystickBase.style.top = cy + 'px';
            updateJoystick(cx, cy);
        }
        function handleMove(e) {
            if (!isTouching || isPaused || isGameOver) return; e.preventDefault();
            updateJoystick(e.touches ? e.touches[0].clientX : e.clientX, e.touches ? e.touches[0].clientY : e.clientY);
        }
        function handleEnd() { isTouching = false; joyVector = { x: 0, y: 0 }; joystickBase.style.display = 'none'; joystickStick.style.transform = `translate(0px, 0px)`; }
        function updateJoystick(cx, cy) {
            let dx = cx - joyOrigin.x, dy = cy - joyOrigin.y, dist = Math.hypot(dx, dy), max = 60; 
            if (dist > max) { dx = (dx / dist) * max; dy = (dy / dist) * max; }
            joystickStick.style.transform = `translate(${dx}px, ${dy}px)`;
            if (dist > 0) { joyVector.x = dx / max; joyVector.y = dy / max; } else { joyVector = { x: 0, y: 0 }; }
        }
        const keys = {}; window.addEventListener('keydown', e => keys[e.key] = true); window.addEventListener('keyup', e => keys[e.key] = false);

        function drawHealthBar(ctx, x, y, hp, maxHp, barWidth, isPlayer = false) {
            const pct = Math.max(0, hp / maxHp); const barHeight = 4;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)'; ctx.fillRect(x - barWidth/2, y, barWidth, barHeight);
            ctx.fillStyle = isPlayer ? '#2ecc71' : (pct > 0.5 ? '#e74c3c' : '#c0392b'); ctx.fillRect(x - barWidth/2, y, barWidth * pct, barHeight);
        }

        // --- スキルDB（ドローン、地雷、レーザー追加） ---
        const SKILL_DB = {
            kunai: { name: 'クナイ', desc: '最も近い敵を自動で狙う' }, 
            forcefield: { name: 'フォース', desc: '周囲に継続ダメージ' },
            guardian: { name: 'ガーディアン', desc: '周囲を回転する刃' }, 
            lightning: { name: '雷発生器', desc: 'ランダムな敵に雷' },
            rpg: { name: 'ロケット', desc: '着弾で爆発するロケット' }, 
            brick: { name: 'レンガ', desc: '放り投げて落下ダメージ' },
            soccer: { name: 'サッカー', desc: '画面を反射して飛び回る' }, 
            drill: { name: 'ドリル', desc: '敵を貫通し壁で反射' },
            boomerang: { name: 'ブーメラン', desc: '手元に戻る刃を投げる' }, 
            molotov: { name: '火炎瓶', desc: '地面に炎エリア' },
            drone: { name: 'ドローン', desc: '敵を追尾するミサイルを撃つ' }, // ★新規
            mine: { name: '地雷', desc: '足元に強力な地雷を設置する' }, // ★新規
            laser: { name: 'レーザー', desc: '敵を貫通する高速レーザー' }, // ★新規
            atkUp: { name: '強力銃弾', desc: '攻撃力アップ (+30%)' }, 
            speedUp: { name: 'スニーカー', desc: '移動速度アップ (+20%)' }, 
            hpUp: { name: 'フィットネス', desc: '最大HPアップ (+30%)' }, 
            armor: { name: '防弾チョッキ', desc: '受けるダメージを軽減' },
            expUp: { name: '経験値の書', desc: '獲得経験値アップ (+30%)' }, 
            choiceUp: { name: '選択肢拡張', desc: '次からのレベルアップ選択肢が1つ増える' }
        };

        class Player {
            constructor() {
                this.x = WORLD_WIDTH / 2; this.y = WORLD_HEIGHT / 2; this.radius = 15; this.color = '#3498db';
                this.baseSpeed = 3.5; this.baseMaxHp = 100; this.hp = this.baseMaxHp;
                this.level = 1; this.exp = 0; 
                this.expToNext = 2; // ★初期の必要経験値を大幅に削減
                this.skills = { kunai: 1 };
                this.bossExpBonus = 0;
            }
            get speed() { return this.baseSpeed * (1 + (this.skills.speedUp || 0) * 0.20); }
            get maxHp() { return this.baseMaxHp * (1 + (this.skills.hpUp || 0) * 0.30); }
            get atkMult() { return 1 + (this.skills.atkUp || 0) * 0.3; }
            get expMult() { return (1 + (this.skills.expUp || 0) * 0.3 + (this.level - 1) * 0.1 + this.bossExpBonus); }

            update() {
                let mx = joyVector.x, my = joyVector.y;
                if (!isTouching) {
                    mx = (keys['d']||keys['ArrowRight']?1:0) - (keys['a']||keys['ArrowLeft']?1:0); my = (keys['s']||keys['ArrowDown']?1:0) - (keys['w']||keys['ArrowUp']?1:0);
                    if (mx !== 0 && my !== 0) { mx /= Math.SQRT2; my /= Math.SQRT2; }
                }
                this.x = Math.max(this.radius, Math.min(WORLD_WIDTH - this.radius, this.x + mx * this.speed));
                this.y = Math.max(this.radius, Math.min(WORLD_HEIGHT - this.radius, this.y + my * this.speed));
            }
            draw() {
                let cx = this.x - camera.x, cy = this.y - camera.y;
                if (this.skills.forcefield) {
                    ctx.beginPath(); ctx.arc(cx, cy, 50 + this.skills.forcefield * 12, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(52, 152, 219, 0.2)'; ctx.fill(); ctx.strokeStyle = 'rgba(52, 152, 219, 0.5)'; ctx.lineWidth = 2; ctx.stroke();
                }
                ctx.beginPath(); ctx.arc(cx, cy, this.radius, 0, Math.PI * 2); ctx.fillStyle = this.color; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
                drawHealthBar(ctx, cx, cy - this.radius - 10, this.hp, this.maxHp, 40, true);
            }
            takeDamage(amount) {
                this.hp -= amount * (1 - (this.skills.armor || 0) * 0.15);
                if (this.hp <= 0) gameOver();
            }
            addExp(amount) {
                this.exp += amount * this.expMult;
                if (this.exp >= this.expToNext) {
                    this.exp -= this.expToNext; this.level++; 
                    // ★レベルアップごとの経験値の増加量を緩やかに（必要経験値が少ない状態を長く維持）
                    this.expToNext = Math.floor(this.expToNext * 1.3) + 2;
                    this.hp = Math.min(this.hp + this.maxHp * 0.2, this.maxHp); 
                    document.getElementById('level-display').innerText = this.level; triggerLevelUp();
                }
                document.getElementById('exp-bar').style.width = ((this.exp / this.expToNext) * 100) + '%';
            }
        }

        class Enemy {
            constructor(typeStats) {
                const side = Math.floor(Math.random() * 4);
                if (side === 0) { this.x = camera.x + Math.random() * width; this.y = camera.y - 40; } 
                else if (side === 1) { this.x = camera.x + width + 40; this.y = camera.y + Math.random() * height; }
                else if (side === 2) { this.x = camera.x + Math.random() * width; this.y = camera.y + height + 40; }
                else { this.x = camera.x - 40; this.y = camera.y + Math.random() * height; } 
                
                this.radius = typeStats.radius; this.speed = typeStats.speed * (Math.random() * 0.4 + 0.8);
                this.color = typeStats.color; this.maxHp = typeStats.hp; this.hp = this.maxHp;
                this.damage = typeStats.damage; this.expValue = typeStats.exp;
                this.isSpecialBoss = typeStats.isSpecialBoss || false;
            }
            update(tx, ty) {
                const dist = Math.hypot(tx - this.x, ty - this.y);
                if (dist > 0) { this.x += ((tx - this.x) / dist) * this.speed; this.y += ((ty - this.y) / dist) * this.speed; }
            }
            draw() {
                if(!isVisible(this.x, this.y, this.radius)) return;
                let cx = this.x - camera.x, cy = this.y - camera.y;
                ctx.beginPath(); ctx.arc(cx, cy, this.radius, 0, Math.PI * 2); ctx.fillStyle = this.color; ctx.fill();
                if (this.isSpecialBoss) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke(); }
                if (this.hp < this.maxHp) drawHealthBar(ctx, cx, cy - this.radius - 8, this.hp, this.maxHp, this.radius * 2);
            }
            takeDamage(amount) {
                this.hp -= amount; // ダメージ表記ポップアップ処理を削除
            }
        }

        class FieldItem {
            constructor(x, y, type) { this.x = x; this.y = y; this.type = type; this.radius = 16; }
            draw() {
                if(!isVisible(this.x, this.y, this.radius)) return;
                let cx = this.x - camera.x, cy = this.y - camera.y;
                ctx.beginPath(); ctx.arc(cx, cy, this.radius, 0, Math.PI*2);
                ctx.fillStyle = this.type === 'bomb' ? '#2c3e50' : (this.type === 'meat' ? '#e74c3c' : '#3498db'); ctx.fill();
                ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 2; ctx.stroke();
                ctx.fillStyle = '#fff'; ctx.font = '16px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(this.type === 'bomb' ? '💣' : (this.type === 'meat' ? '🍖' : '🧲'), cx, cy + 1);
            }
        }

        class Projectile {
            constructor(x, y, vx, vy, speed, radius, color, damage, life, type = 'normal', pierce = 0) {
                this.x = x; this.y = y; this.radius = radius; this.color = color; this.damage = damage; this.life = life; this.maxLife = life;
                this.type = type; this.pierce = pierce; this.hitEnemies = new Set(); this.speed = speed;
                this.target = null; // ドローンのホーミング用ターゲット
                const dist = Math.hypot(vx, vy);
                if(dist > 0) { this.vx = (vx/dist)*speed; this.vy = (vy/dist)*speed; } else { this.vx = vx; this.vy = vy; }
            }
            update() {
                if (this.type === 'gravity') this.vy += 0.4;
                else if (this.type === 'boomerang' && this.life < this.maxLife * 0.6) {
                    const dist = Math.hypot(player.x - this.x, player.y - this.y);
                    if(dist > 0) { this.vx = ((player.x-this.x)/dist)*this.speed; this.vy = ((player.y-this.y)/dist)*this.speed; } this.hitEnemies.clear();
                }
                else if (this.type === 'homing' && this.target && this.target.hp > 0) {
                    // ドローンのホーミング軌道計算
                    let dx = this.target.x - this.x, dy = this.target.y - this.y;
                    let dist = Math.hypot(dx, dy);
                    if (dist > 0) {
                        this.vx = this.vx * 0.9 + (dx / dist * this.speed) * 0.1;
                        this.vy = this.vy * 0.9 + (dy / dist * this.speed) * 0.1;
                        let curSpeed = Math.hypot(this.vx, this.vy);
                        if(curSpeed > 0) { this.vx = (this.vx/curSpeed)*this.speed; this.vy = (this.vy/curSpeed)*this.speed; }
                    }
                }
                else if (this.type === 'mine') {
                    this.vx = 0; this.vy = 0; // 地雷は動かない
                }
                
                this.x += this.vx; this.y += this.vy; this.life--;
                
                if (this.type === 'bounce') {
                    if (this.x - this.radius < camera.x || this.x + this.radius > camera.x + width) { this.vx *= -1; this.x = Math.max(camera.x+this.radius, Math.min(camera.x+width-this.radius, this.x)); }
                    if (this.y - this.radius < camera.y || this.y + this.radius > camera.y + height) { this.vy *= -1; this.y = Math.max(camera.y+this.radius, Math.min(camera.y+height-this.radius, this.y)); }
                }
            }
            draw() {
                if(!isVisible(this.x, this.y, this.radius)) return;
                ctx.beginPath(); ctx.arc(this.x - camera.x, this.y - camera.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = this.color; ctx.fill();
                if (this.type === 'mine') { ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 2; ctx.stroke(); } // 地雷に黄色い枠線
            }
        }

        class Effect {
            constructor(x, y, radius, color, duration, type = 'explosion', damage = 0) {
                this.x = x; this.y = y; this.maxRadius = radius; this.radius = type === 'firezone' ? radius : 0;
                this.color = color; this.maxDuration = duration; this.duration = duration; this.type = type; this.damage = damage; this.hasHit = false;
            }
            update() { this.duration--; if(this.type !== 'firezone') this.radius = this.maxRadius * (1 - this.duration / this.maxDuration); }
            draw() {
                if(this.maxRadius < 1000 && !isVisible(this.x, this.y, this.radius)) return; 
                let cx = this.maxRadius >= 1000 ? this.x : this.x - camera.x; let cy = this.maxRadius >= 1000 ? this.y : this.y - camera.y;
                ctx.beginPath(); ctx.arc(cx, cy, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color; ctx.globalAlpha = this.type === 'firezone' ? 0.5 : (this.duration / this.maxDuration); ctx.fill(); ctx.globalAlpha = 1.0;
            }
        }

        class Gem {
            constructor(x, y, value) {
                this.x = x; this.y = y; this.value = value; this.magnetized = false;
                // ★経験値の見た目（色・大きさ）を価値に応じて変更
                if (value >= 50) {
                    this.radius = 10; this.color = '#f1c40f'; // ゴールド (ボス)
                } else if (value >= 6) {
                    this.radius = 8; this.color = '#00ffff'; // 水色/ダイヤ色 (紫タンク用)
                } else if (value > 2) {
                    this.radius = 6; this.color = '#3498db'; // 青 (中型)
                } else {
                    this.radius = 5; this.color = '#2ecc71'; // 緑 (小型)
                }
            }
            draw() {
                if(!isVisible(this.x, this.y, this.radius)) return;
                let cx = this.x - camera.x, cy = this.y - camera.y;
                // ひし形（ダイヤ型）の描画
                ctx.beginPath(); ctx.moveTo(cx, cy - this.radius); ctx.lineTo(cx + this.radius, cy); ctx.lineTo(cx, cy + this.radius); ctx.lineTo(cx - this.radius, cy);
                ctx.fillStyle = this.color; ctx.fill();
            }
        }

        let player, enemies, projectiles, effects, gems, items;
        let isGameOver = false, isPaused = false, frameCount = 0, gameTime = 0;
        let cooldowns = {};
        
        let globalEnemyStatMultiplier = 1; let lastWaveResetTime = 0; let isBossStage = false;

        function initGame() {
            player = new Player(); enemies = []; projectiles = []; effects = []; gems = []; items = [];
            isGameOver = false; isPaused = false; frameCount = 0; gameTime = 0;
            globalEnemyStatMultiplier = 1; lastWaveResetTime = 0; isBossStage = false;
            for(let key in SKILL_DB) cooldowns[key] = 0;
            document.getElementById('game-over').style.display = 'none'; document.getElementById('level-up-modal').style.display = 'none';
            document.getElementById('exp-bar').style.width = '0%'; requestAnimationFrame(gameLoop);
        }

        // 紫の敵(tank)の獲得経験値(exp)は6。Gemの生成時に水色(ダイヤ色)になる
        const ENEMY_TYPES = {
            normal: { radius: 12, speed: 1.0, color: '#e74c3c', hp: 4, damage: 5, exp: 2 },
            fast: { radius: 10, speed: 1.8, color: '#f1c40f', hp: 3, damage: 3, exp: 2 },
            swarm: { radius: 8, speed: 1.3, color: '#9b59b6', hp: 1.5, damage: 2, exp: 1 },
            tank: { radius: 20, speed: 0.6, color: '#8e44ad', hp: 25, damage: 15, exp: 6 },
            boss: { radius: 35, speed: 0.8, color: '#000', hp: 300, damage: 30, exp: 50 },
            special_boss: { radius: 80, speed: 1.2, color: '#8b0000', hp: 6000, damage: 50, exp: 3000, isSpecialBoss: true }
        };

        function spawnEnemies() {
            if (!isBossStage && gameTime > 0 && gameTime % 600 === 0 && frameCount % 60 === 0) {
                isBossStage = true;
                effects.push(new Effect(width/2, height/2, Math.max(width, height)*2, 'rgba(255, 0, 0, 0.8)', 60, 'explosion', 0));
                enemies = []; 
                const warning = document.getElementById('boss-warning'); warning.style.display = 'block'; setTimeout(() => { warning.style.display = 'none'; }, 4000);
                let stats = {...ENEMY_TYPES['special_boss']}; stats.hp *= globalEnemyStatMultiplier; stats.damage *= globalEnemyStatMultiplier; enemies.push(new Enemy(stats));
                return;
            }
            if (isBossStage) return;

            let waveTime = gameTime - lastWaveResetTime;
            let hpMult = (1 + (waveTime / 60) * 0.8) * globalEnemyStatMultiplier;
            let interval = Math.max(8, 60 - Math.floor(waveTime / 10)); 
            let count = 1 + Math.floor(waveTime / 25);

            let types = ['normal'];
            if (waveTime > 30) types.push('fast'); if (waveTime > 60) types.push('swarm', 'swarm');
            if (waveTime > 120) types.push('tank'); if (waveTime > 180) types = ['fast', 'swarm', 'tank']; 

            if (frameCount % interval === 0) {
                for(let i=0; i<count; i++) {
                    const stats = {...ENEMY_TYPES[types[Math.floor(Math.random() * types.length)]]};
                    stats.hp *= hpMult; stats.damage *= globalEnemyStatMultiplier; enemies.push(new Enemy(stats));
                }
            }
            if (waveTime > 0 && waveTime % 60 === 0 && frameCount % 60 === 0) { 
                const stats = {...ENEMY_TYPES['boss']}; stats.hp *= hpMult; stats.damage *= globalEnemyStatMultiplier; enemies.push(new Enemy(stats));
            }
            
            if (gameTime > 0 && gameTime % 60 === 0 && frameCount % 60 === 0) {
                const dist = 600;
                ['bomb', 'meat', 'magnet'].forEach(type => {
                    let rx = player.x + (Math.random() - 0.5) * dist * 2, ry = player.y + (Math.random() - 0.5) * dist * 2;
                    items.push(new FieldItem(Math.max(50, Math.min(WORLD_WIDTH-50, rx)), Math.max(50, Math.min(WORLD_HEIGHT-50, ry)), type));
                });
            }
        }

        function getClosestEnemy() {
            if(enemies.length === 0) return null;
            let closest = enemies[0], minDist = Math.hypot(player.x - closest.x, player.y - closest.y);
            for (let i = 1; i < enemies.length; i++) {
                let dist = Math.hypot(player.x - enemies[i].x, player.y - enemies[i].y);
                if (dist < minDist) { minDist = dist; closest = enemies[i]; }
            }
            return closest;
        }

        function fireWeapons() {
            const mult = player.atkMult;
            if (player.skills.kunai && frameCount - cooldowns.kunai >= Math.max(10, 60 - player.skills.kunai * 10)) {
                let t = getClosestEnemy(); if (t) {
                    let dmg = 4 * mult * (1 + player.skills.kunai*0.3);
                    projectiles.push(new Projectile(player.x, player.y, t.x - player.x, t.y - player.y, 14, 5, '#fff', dmg, 100));
                    if (player.skills.kunai >= 3) projectiles.push(new Projectile(player.x, player.y, -(t.x - player.x), -(t.y - player.y), 14, 5, '#fff', dmg, 100));
                    cooldowns.kunai = frameCount;
                }
            }
            if (player.skills.guardian) {
                let count = 1 + player.skills.guardian, dmg = 3 * mult, speed = 0.05 + player.skills.guardian*0.015;
                for(let i=0; i<count; i++) {
                    let angle = (frameCount * speed) + (i * (Math.PI * 2 / count));
                    let bx = player.x + Math.cos(angle) * 70, by = player.y + Math.sin(angle) * 70;
                    ctx.beginPath(); ctx.arc(bx - camera.x, by - camera.y, 9, 0, Math.PI * 2); ctx.fillStyle = '#e67e22'; ctx.fill();
                    for (let e of enemies) { 
                        if (Math.hypot(bx - e.x, by - e.y) < 9 + e.radius) { 
                            e.takeDamage(dmg); e.x += Math.cos(angle)*12; e.y += Math.sin(angle)*12; 
                        } 
                    }
                }
            }
            if (player.skills.forcefield && frameCount % 30 === 0) {
                let r = 50 + player.skills.forcefield * 12, dmg = 2 * mult * (1 + player.skills.forcefield*0.4);
                for (let e of enemies) if (Math.hypot(player.x - e.x, player.y - e.y) < r + e.radius) e.takeDamage(dmg);
            }
            if (player.skills.lightning && frameCount - cooldowns.lightning >= Math.max(15, 120 - player.skills.lightning * 15) && enemies.length > 0) {
                for(let i=0; i<Math.ceil(player.skills.lightning/2); i++) {
                    let t = enemies[Math.floor(Math.random() * enemies.length)];
                    if(t) {
                        t.takeDamage(18 * mult * (1 + player.skills.lightning*0.5));
                        effects.push(new Effect(t.x, t.y, 30, 'rgba(241, 196, 15, 0.8)', 15, 'lightning'));
                        ctx.beginPath(); ctx.moveTo(t.x - camera.x, t.y - camera.y - height); ctx.lineTo(t.x - camera.x, t.y - camera.y); ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 4; ctx.stroke();
                    }
                }
                cooldowns.lightning = frameCount;
            }
            if (player.skills.rpg && frameCount - cooldowns.rpg >= Math.max(30, 180 - player.skills.rpg * 20)) {
                let t = getClosestEnemy(); if (t) {
                    projectiles.push(new Projectile(player.x, player.y, t.x - player.x, t.y - player.y, 7, 8, '#c0392b', 15 * mult * (1+player.skills.rpg*0.5), 150, 'rpg'));
                    cooldowns.rpg = frameCount;
                }
            }
            if (player.skills.brick && frameCount - cooldowns.brick >= Math.max(20, 120 - player.skills.brick * 15)) {
                for(let i=0; i<player.skills.brick; i++) projectiles.push(new Projectile(player.x, player.y, (Math.random()-0.5)*5, -8-Math.random()*4, 1, 10, '#d35400', 10 * mult, 100, 'gravity', 99));
                cooldowns.brick = frameCount;
            }
            if (player.skills.soccer && frameCount - cooldowns.soccer >= Math.max(30, 180 - player.skills.soccer * 20)) {
                for(let i=0; i<Math.ceil(player.skills.soccer/2); i++) {
                    let a = Math.random() * Math.PI * 2; projectiles.push(new Projectile(player.x, player.y, Math.cos(a), Math.sin(a), 8, 11, '#ecf0f1', 8 * mult, 200, 'bounce', 3 + player.skills.soccer));
                }
                cooldowns.soccer = frameCount;
            }
            if (player.skills.drill && frameCount - cooldowns.drill >= Math.max(40, 200 - player.skills.drill * 20)) {
                let t = getClosestEnemy(); if(t) projectiles.push(new Projectile(player.x, player.y, t.x-player.x, t.y-player.y, 12 + player.skills.drill, 7, '#34495e', 5 * mult, 300, 'bounce', 999));
                cooldowns.drill = frameCount;
            }
            if (player.skills.boomerang && frameCount - cooldowns.boomerang >= Math.max(20, 100 - player.skills.boomerang * 10)) {
                let t = getClosestEnemy(); if (t) {
                    projectiles.push(new Projectile(player.x, player.y, t.x-player.x, t.y-player.y, 9, 8, '#95a5a6', 6 * mult, 70, 'boomerang', 99));
                    if(player.skills.boomerang >= 3) projectiles.push(new Projectile(player.x, player.y, -(t.x-player.x), -(t.y-player.y), 9, 8, '#95a5a6', 6 * mult, 70, 'boomerang', 99));
                    cooldowns.boomerang = frameCount;
                }
            }
            if (player.skills.molotov && frameCount - cooldowns.molotov >= Math.max(40, 180 - player.skills.molotov * 20)) {
                for(let i=0; i<1 + Math.floor(player.skills.molotov/2); i++) {
                    effects.push(new Effect(player.x + (Math.random()-0.5)*250, player.y + (Math.random()-0.5)*250, 45 + player.skills.molotov*12, 'rgba(230, 126, 34, 0.4)', 180, 'firezone', 2 * mult));
                }
                cooldowns.molotov = frameCount;
            }
            // ★追加武器：ドローン (ホーミング弾)
            if (player.skills.drone && frameCount - cooldowns.drone >= Math.max(25, 150 - player.skills.drone * 20)) {
                let t = getClosestEnemy(); if (t) {
                    let count = 1 + Math.floor(player.skills.drone / 2);
                    for(let i=0; i<count; i++) {
                        let p = new Projectile(player.x, player.y - 20, (Math.random()-0.5)*10, -5-Math.random()*5, 8, 6, '#9b59b6', 7 * mult * (1+player.skills.drone*0.2), 200, 'homing', 1);
                        p.target = t; // ターゲット情報を渡す
                        projectiles.push(p);
                    }
                    cooldowns.drone = frameCount;
                }
            }
            // ★追加武器：地雷
            if (player.skills.mine && frameCount - cooldowns.mine >= Math.max(40, 240 - player.skills.mine * 30)) {
                let count = 1 + Math.floor(player.skills.mine / 3);
                for(let i=0; i<count; i++) {
                    // 足元に速度0のProjectileとして配置
                    projectiles.push(new Projectile(player.x + (Math.random()-0.5)*40, player.y + (Math.random()-0.5)*40, 0, 0, 0, 12, '#c0392b', 25 * mult * (1+player.skills.mine*0.5), 600, 'mine', 1));
                }
                cooldowns.mine = frameCount;
            }
            // ★追加武器：レーザー (高速貫通)
            if (player.skills.laser && frameCount - cooldowns.laser >= Math.max(30, 150 - player.skills.laser * 20)) {
                let t = getClosestEnemy(); if (t) {
                    projectiles.push(new Projectile(player.x, player.y, t.x - player.x, t.y - player.y, 40, 4 + player.skills.laser, '#00ffff', 12 * mult * (1+player.skills.laser*0.3), 60, 'laser', 999));
                    cooldowns.laser = frameCount;
                }
            }
        }

        function triggerLevelUp() {
            isPaused = true; joystickBase.style.display = 'none';
            let numChoices = 3 + (player.skills.choiceUp || 0);
            let available = Object.keys(SKILL_DB); 
            let choices = []; 
            let ownedSkills = Object.keys(player.skills);
            
            if (ownedSkills.length > 0) {
                let guaranteed = ownedSkills[Math.floor(Math.random() * ownedSkills.length)];
                choices.push(guaranteed);
                available.splice(available.indexOf(guaranteed), 1);
            }
            
            while (choices.length < numChoices && available.length > 0) {
                let idx = Math.floor(Math.random() * available.length);
                choices.push(available.splice(idx, 1)[0]);
            }
            
            const container = document.getElementById('skill-choices'); container.innerHTML = '';
            choices.forEach(id => {
                let db = SKILL_DB[id], nextLv = (player.skills[id] || 0) + 1;
                addSkillChoiceToDOM(id, `${db.name} (Lv${nextLv})`, db.desc, () => {
                    player.skills[id] = nextLv; if(id === 'hpUp') player.hp += player.baseMaxHp * 0.3; closeLevelUp();
                });
            });
            document.getElementById('level-up-modal').style.display = 'flex';
        }
        
        function addSkillChoiceToDOM(id, name, desc, onClick) {
            const card = document.createElement('div'); card.className = 'skill-card'; card.innerHTML = `<div class="skill-name">${name}</div><div class="skill-desc">${desc}</div>`; card.onclick = onClick; document.getElementById('skill-choices').appendChild(card);
        }
        function closeLevelUp() { document.getElementById('level-up-modal').style.display = 'none'; handleEnd(); isPaused = false; }
        function gameOver() { isGameOver = true; document.getElementById('game-over').style.display = 'block'; joystickBase.style.display = 'none'; }
        
        document.getElementById('game-over').addEventListener('click', () => { if(isGameOver) initGame(); });
        document.getElementById('game-over').addEventListener('touchstart', (e) => { e.preventDefault(); if(isGameOver) initGame(); });

        function drawBackgroundGrid() {
            ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 2;
            const size = 100, offX = -(camera.x % size), offY = -(camera.y % size);
            ctx.beginPath();
            for(let x = offX; x < width; x += size) { ctx.moveTo(x, 0); ctx.lineTo(x, height); }
            for(let y = offY; y < height; y += size) { ctx.moveTo(0, y); ctx.lineTo(width, y); }
            ctx.stroke();
            ctx.strokeStyle = 'rgba(231, 76, 60, 0.5)'; ctx.lineWidth = 5; ctx.strokeRect(-camera.x, -camera.y, WORLD_WIDTH, WORLD_HEIGHT);
        }

        function drawMinimap() {
            const mapW = 120, mapH = 120, pad = 15, startX = width - mapW - pad, startY = 70;
            ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(startX, startY, mapW, mapH);
            ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.strokeRect(startX, startY, mapW, mapH);
            const scaleX = mapW / WORLD_WIDTH, scaleY = mapH / WORLD_HEIGHT;
            ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.strokeRect(startX + camera.x * scaleX, startY + camera.y * scaleY, width * scaleX, height * scaleY);
            ctx.fillStyle = '#f1c40f'; items.forEach(i => { ctx.beginPath(); ctx.arc(startX + i.x * scaleX, startY + i.y * scaleY, 2, 0, Math.PI*2); ctx.fill(); });
            ctx.fillStyle = '#e74c3c'; enemies.forEach(e => { if (e.radius > 20) { ctx.beginPath(); ctx.arc(startX + e.x * scaleX, startY + e.y * scaleY, 3, 0, Math.PI*2); ctx.fill(); } });
            ctx.fillStyle = '#3498db'; ctx.beginPath(); ctx.arc(startX + player.x * scaleX, startY + player.y * scaleY, 3.5, 0, Math.PI*2); ctx.fill();
        }

        function gameLoop(timestamp) {
            requestAnimationFrame(gameLoop);
            if (isGameOver) return;
            ctx.clearRect(0, 0, width, height);
            
            if (isPaused) { 
                drawBackgroundGrid(); player.draw(); enemies.forEach(e => e.draw()); drawMinimap(); 
                return; 
            }

            frameCount++;
            if (frameCount % 60 === 0) {
                gameTime++; document.getElementById('timer').innerText = `${Math.floor(gameTime/60).toString().padStart(2,'0')}:${(gameTime%60).toString().padStart(2,'0')}`;
            }

            player.update();
            camera.x = Math.max(0, Math.min(WORLD_WIDTH - width, player.x - width / 2)); camera.y = Math.max(0, Math.min(WORLD_HEIGHT - height, player.y - height / 2));
            drawBackgroundGrid(); spawnEnemies(); 

            for(let i = items.length - 1; i >= 0; i--) {
                let it = items[i]; it.draw();
                if(Math.hypot(player.x - it.x, player.y - it.y) < player.radius + it.radius) {
                    if(it.type === 'bomb') {
                        effects.push(new Effect(width/2, height/2, Math.max(width, height)*2, 'rgba(255,255,255,0.9)', 30, 'explosion', 0));
                        enemies.forEach(e => { if(!e.isSpecialBoss) gems.push(new Gem(e.x, e.y, e.expValue)); });
                        enemies = enemies.filter(e => e.isSpecialBoss); 
                    } else if(it.type === 'meat') player.hp = Math.min(player.maxHp, player.hp + player.maxHp * 0.5);
                    else if(it.type === 'magnet') gems.forEach(g => g.magnetized = true);
                    items.splice(i, 1);
                }
            }

            player.draw(); fireWeapons();
            
            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i]; p.update(); p.draw();
                if (p.life <= 0) { projectiles.splice(i, 1); continue; }
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    if (!p.hitEnemies.has(e) && Math.hypot(p.x - e.x, p.y - e.y) < p.radius + e.radius) {
                        e.takeDamage(p.damage); p.hitEnemies.add(e); 
                        if (p.type === 'rpg') effects.push(new Effect(p.x, p.y, 45, 'rgba(231, 76, 60, 0.7)', 20, 'explosion', p.damage));
                        if (p.type === 'mine') { // 地雷の爆発
                            effects.push(new Effect(p.x, p.y, 80 + (player.skills.mine||1)*15, 'rgba(231, 76, 60, 0.9)', 30, 'explosion', p.damage));
                            p.life = 0; // 地雷は1回で消滅
                        }
                        if (p.type === 'bounce') { p.vx *= -1; p.vy *= -1; p.hitEnemies.clear(); }
                        if (p.pierce <= p.hitEnemies.size) { projectiles.splice(i, 1); break; }
                    }
                }
            }

            for (let i = effects.length - 1; i >= 0; i--) {
                let ef = effects[i]; ef.update(); ef.draw();
                if (ef.type === 'explosion' && !ef.hasHit) {
                    for (let e of enemies) if (Math.hypot(ef.x - e.x, ef.y - e.y) < ef.radius) e.takeDamage(ef.damage * 0.5);
                    ef.hasHit = true;
                }
                if (ef.type === 'firezone' && frameCount % 15 === 0) { 
                    for (let e of enemies) if (Math.hypot(ef.x - e.x, ef.y - e.y) < ef.radius + e.radius) e.takeDamage(ef.damage);
                }
                if (ef.duration <= 0) effects.splice(i, 1);
            }
            
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                if (e.hp <= 0) { 
                    gems.push(new Gem(e.x, e.y, e.expValue)); 
                    if (e.isSpecialBoss) {
                        isBossStage = false; player.bossExpBonus += 2.0; globalEnemyStatMultiplier *= 3; lastWaveResetTime = gameTime;
                        effects.push(new Effect(width/2, height/2, Math.max(width, height)*2, 'rgba(255, 255, 255, 0.9)', 60, 'explosion', 0));
                    }
                    enemies.splice(i, 1); continue; 
                }
                e.update(player.x, player.y); e.draw();
                if (Math.hypot(player.x - e.x, player.y - e.y) < player.radius + e.radius) player.takeDamage(e.damage / 60);
            }
            
            const magnetRange = player.radius + 100;
            for (let i = gems.length - 1; i >= 0; i--) {
                gems[i].draw();
                const dist = Math.hypot(player.x - gems[i].x, player.y - gems[i].y);
                if (gems[i].magnetized || dist < magnetRange) { 
                    let speed = gems[i].magnetized ? 25 : 10;
                    gems[i].x += (player.x - gems[i].x) / dist * speed; gems[i].y += (player.y - gems[i].y) / dist * speed;
                    if (dist < player.radius + gems[i].radius + speed) { player.addExp(gems[i].value); gems.splice(i, 1); }
                }
            }

            drawMinimap();
        }
        initGame();
    </script>
